# Configuration for the Packages page (/packages/) — package download statistics.
#
# List one Package URL (PURL — https://github.com/package-url/purl-spec) per
# published package. `pkg:npm/...` and `pkg:pypi/...` are supported; a version,
# scope, qualifiers, or subpath are all tolerated and ignored (e.g.
# `pkg:npm/%40scope/name@1.2.3` resolves to the `@scope/name` package). PyPI
# names are normalised per PEP 503, so `pkg:pypi/Foo_Bar` and `pkg:pypi/foo-bar`
# are the same package.
#
# Statistics are fetched at BUILD TIME by scripts/fetch_package_stats.py and
# written to _data/package_stats.yml (a build-time artifact, regenerated on
# every deploy and not committed to the repo). To add a package, drop its PURL
# below and rebuild — nothing else needs touching.
purls:
