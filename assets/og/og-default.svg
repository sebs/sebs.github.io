<!--
  Social card. Colours are the IBM Carbon Gray 100 theme tokens used across the
  site (background #161616, text-primary #f4f4f4, text-secondary #c6c6c6,
  text-helper #8d8d8d, border-subtle-01 #393939, link-primary Blue 50 #4589ff)
  and the type is IBM Plex, Carbon's typeface. CI installs fonts-ibm-plex
  before rasterizing this with rsvg-convert; the fallback stack covers the case
  where it is unavailable.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#161616"/>

  <!-- Carbon 2x Grid gutters, drawn in border-subtle-01. -->
  <g stroke="#393939" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
  </g>

  <!-- Blue 50 accent bar on the leading gutter. -->
  <rect x="77" y="200" width="6" height="240" fill="#4589ff"/>

  <g font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="4">
    <text x="112" y="92" fill="#8d8d8d">HAMBURG, DE — 53.55° N, 9.99° E</text>
  </g>

  <g font-family="'IBM Plex Sans', 'DejaVu Sans', system-ui, sans-serif">
    <text x="112" y="300" fill="#f4f4f4" font-size="92" font-weight="300" letter-spacing="-3">Sebastian Schürmann</text>
    <text x="112" y="372" fill="#4589ff" font-size="34" font-weight="400">TypeScript &amp; Python developer · Open-source maintainer</text>
    <text x="112" y="430" fill="#c6c6c6" font-size="28" font-weight="400">I build developer tooling and write about it.</text>
  </g>

  <g font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="22" fill="#8d8d8d" letter-spacing="1">
    <text x="112" y="560">github.com/sebs</text>
    <text x="392" y="560" fill="#525252">·</text>
    <text x="422" y="560">dev.to/sebs</text>
  </g>
</svg>
